{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto text-center py-16">
    <div class="text-8xl mb-8"><i data-lucide="book-open"></i></div>
    <h2 class="text-3xl font-bold text-gray-800 mb-4">Story Not Found</h2>
    <p class="text-gray-600 mb-8">The story you're looking for doesn't exist or may have been removed.</p>
    
    <div class="bg-yellow-50 p-6 rounded-lg border border-yellow-200 mb-8">
        <div class="text-yellow-800 text-sm">
            <strong><i data-lucide="lightbulb"></i> Suggestion:</strong> The story might have been moved or deleted. Try browsing our available stories or create a new one!
        </div>
    </div>
    
    <div class="flex space-x-4 justify-center">
         <a href="/stories" class="inline-flex items-center gap-1.5 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors font-medium">
            <i data-lucide="book-open"></i> Browse Stories
        </a>
         <a href="/stories/create" class="inline-flex items-center gap-1.5 bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors font-medium">
            <i data-lucide="pen-tool"></i> Create New Story
        </a>
    </div>
</div>
{% endblock %}
